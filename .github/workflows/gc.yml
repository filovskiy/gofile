name: gc

# Раз в неделю сжимает всю историю репозитория в один коммит.
# Каждый файл = один коммит, поэтому история быстро растёт; сжатие
# держит репозиторий маленьким и стирает метаданные старых загрузок.

on:
  schedule:
    - cron: "41 2 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  squash:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Squash history to a single commit
        run: |
          set -e
          git config user.name "gofile-bot"
          git config user.email "gofile-bot@users.noreply.github.com"
          git checkout --orphan fresh
          git add -A
          git commit -m "history squashed"
          git push --force origin HEAD:main
